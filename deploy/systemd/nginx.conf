# 裸机自托管用的 nginx 主配置：渲染后的前门配置由 include 挂进 http 块。
# 运行目录、日志目录与临时缓存目录均由 agent-pulse-web.service 通过
# RuntimeDirectory / LogsDirectory / CacheDirectory 自动创建并隔离授权。
worker_processes auto;
error_log /var/log/agent-pulse-web/error.log warn;
pid /run/agent-pulse-web/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /var/log/agent-pulse-web/access.log;

    client_body_temp_path /var/cache/agent-pulse-web/body;
    proxy_temp_path /var/cache/agent-pulse-web/proxy;
    fastcgi_temp_path /var/cache/agent-pulse-web/fastcgi;
    uwsgi_temp_path /var/cache/agent-pulse-web/uwsgi;
    scgi_temp_path /var/cache/agent-pulse-web/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 渲染结果：会话 Cookie 白名单、令牌注入、静态托管与 API 反代。
    include /run/agent-pulse-web/web.conf;
}
