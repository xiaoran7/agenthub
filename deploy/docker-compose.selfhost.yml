name: agenthub-selfhost

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: agenthub-api
    restart: unless-stopped
    env_file:
      - path: ./docker.env
        required: false
    volumes:
      - agenthub_data:/app/data
    # Web shares this network namespace. Only the Web port is published.
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=127.0.0.1
      - PORT=3001
      - AGENTHUB_GATEWAY_DATABASE=/app/data/gateway.db
      - AGENTHUB_REMOTE_DATABASE=/app/data/remote.db
      # 登录限流 scope 的 HMAC 密钥：生产模式必填（>=32 字节 base64url 随机值），缺失时拒绝启动。
      - AGENT_PULSE_LOGIN_RATE_LIMIT_SECRET=${AGENT_PULSE_LOGIN_RATE_LIMIT_SECRET:?Set AGENT_PULSE_LOGIN_RATE_LIMIT_SECRET to at least 32 random base64url bytes}
      - AGENT_PULSE_TRUST_PROXY_HOPS=${AGENT_PULSE_TRUST_PROXY_HOPS:-}
      # 局域网 HTTP 自托管默认允许非 Secure Cookie；若前端已接入 HTTPS 反向代理，请设为 true 启用 __Host- Cookie。
      - AGENT_PULSE_COOKIE_SECURE=${AGENT_PULSE_COOKIE_SECURE:-false}
      # 可选：单用户无账号 Bearer 兼容模式（仅当宿主环境或 deploy/docker.env 显式设置时才透传，避免空串覆盖默认回落）。
      - AGENT_PLATFORM_OWNER_ID
      - AGENT_PLATFORM_ACCESS_TOKEN

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    container_name: agenthub-web
    restart: unless-stopped
    network_mode: "service:api"
    environment:
      # 自托管默认与生产一致采用账号 Cookie 会话鉴权；仅启用 Bearer 兼容模式时才填入与 API 相同的令牌。
      GATEWAY_ACCESS_TOKEN: ${GATEWAY_ACCESS_TOKEN:-}
      GATEWAY_ORIGIN: http://127.0.0.1:3001
      WEB_PORT: 3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  agenthub_data:
