name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-checks:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Architecture Line Limits
        run: python3 scripts/check-line-limits.py

      - name: Run Workspace Tests
        run: cargo test --workspace

  node-checks:
    name: Node.js & Web Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web Bundle
        run: npm run build --workspace @agent-pulse/web

      - name: Validate Web Proxy Config
        env:
          WEB_PORT: 3100
          WEB_ROOT: /usr/share/nginx/html
          GATEWAY_ORIGIN: http://127.0.0.1:3101
          GATEWAY_ACCESS_TOKEN: ""
          ENVSUBST_FILTER: "^(GATEWAY_|WEB_)"
        run: |
          docker run --rm \
            -e WEB_PORT \
            -e WEB_ROOT \
            -e GATEWAY_ORIGIN \
            -e GATEWAY_ACCESS_TOKEN \
            -e ENVSUBST_FILTER \
            -v "$PWD/deploy/nginx/agenthub-web.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.29-alpine nginx -t

      - name: Run Tests
        run: npm test

      - name: Test Web Proxy Contract
        run: bash scripts/test-web-proxy.sh

  android-checks:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: gradle/actions/setup-gradle@v4 is unusable on this self-hosted
      # runner. That repository is ~350MB, and act_runner performs a FULL clone
      # for every `uses` reference; on this host the transfer is cut off after
      # 6-8 minutes with `fatal: early EOF` (reproduced by cloning the same
      # repo inside the runner container), which leaves the action cache with
      # an unfinished pack and surfaces as `Unable to resolve v4: unsupported
      # object type`, failing the whole android-checks job. The Gradle
      # distribution itself is fetched by the wrapper, so only the Android SDK
      # has to be provided here. Gradle dependency caching is deliberately not
      # wired up: actions/cache on a self-hosted runner would introduce a
      # second failure mode for no correctness gain.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 platform-tools"

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
