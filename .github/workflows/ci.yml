name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Architecture Line Limits
        run: python3 scripts/check-line-limits.py

      - name: Run Workspace Tests
        run: cargo test --workspace

  node-checks:
    name: Node.js & Web Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web Bundle
        run: npm run build --workspace @agent-pulse/web

      - name: Validate Web Proxy Config
        env:
          WEB_HOST: 0.0.0.0
          WEB_PORT: 3100
          WEB_ROOT: /usr/share/nginx/html
          GATEWAY_ORIGIN: http://127.0.0.1:3101
          GATEWAY_ACCESS_TOKEN: ""
          ENVSUBST_FILTER: "^(GATEWAY_|WEB_)"
        run: |
          set -euo pipefail
          CID="agenthub-nginx-validate-$$"
          TMP_DIR="$(mktemp -d)"
          cleanup() {
            docker rm -f "$CID" >/dev/null 2>&1 || true
            rm -rf "$TMP_DIR"
          }
          trap cleanup EXIT
          mkdir -p "$TMP_DIR/templates"
          cp deploy/nginx/agenthub-web.conf.template "$TMP_DIR/templates/default.conf.template"
          docker create --name "$CID" \
            -e WEB_HOST \
            -e WEB_PORT \
            -e WEB_ROOT \
            -e GATEWAY_ORIGIN \
            -e GATEWAY_ACCESS_TOKEN \
            -e ENVSUBST_FILTER \
            nginx:1.29-alpine nginx -t >/dev/null
          docker cp "$TMP_DIR/templates" "$CID:/etc/nginx/"
          docker start -a "$CID"
          docker cp "$CID:/etc/nginx/conf.d/default.conf" "$TMP_DIR/default.conf"
          grep -qF "listen 0.0.0.0:3100;" "$TMP_DIR/default.conf"
          grep -qF "proxy_pass http://127.0.0.1:3101;" "$TMP_DIR/default.conf"
          grep -qF 'proxy_set_header X-User-Id "";' "$TMP_DIR/default.conf"
          grep -qF 'proxy_set_header Forwarded "";' "$TMP_DIR/default.conf"
          grep -qF "location = /health" "$TMP_DIR/default.conf"
          ! grep -qE '\$\{(WEB_|GATEWAY_)' "$TMP_DIR/default.conf"

      - name: Run Tests
        run: npm test

      - name: Test Web Proxy Contract
        run: bash scripts/test-web-proxy.sh

  postgres-checks:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run PostgreSQL Store & Event Broker Tests
        run: |
          set -euo pipefail
          NET="agenthub-pg-test-$$"
          PG_NAME="$NET-postgres"
          cleanup() {
            docker rm -f "$PG_NAME" >/dev/null 2>&1 || true
            docker network disconnect -f "$NET" "$(hostname)" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET" >/dev/null
          docker network connect "$NET" "$(hostname)" >/dev/null 2>&1 || true

          docker run -d --name "$PG_NAME" --network "$NET" \
            -e POSTGRES_USER=agenthub \
            -e POSTGRES_PASSWORD=agenthub \
            -e POSTGRES_DB=agenthub_test \
            postgres:16-alpine >/dev/null

          PG_IP=""
          PG_READY=0
          for _ in $(seq 1 30); do
            PG_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$PG_NAME" 2>/dev/null || true)"
            if [ -n "$PG_IP" ] && docker exec "$PG_NAME" pg_isready -U agenthub -d agenthub_test >/dev/null 2>&1; then
              PG_READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$PG_READY" -ne 1 ]; then
            docker logs "$PG_NAME" >&2 || true
            echo "FAIL: temporary PostgreSQL container did not become ready" >&2
            exit 1
          fi

          export AGENT_PLATFORM_TEST_DATABASE_URL="postgresql://agenthub:agenthub@${PG_IP}:5432/agenthub_test"
          (cd services/api && ../../node_modules/.bin/tsx --test test/postgres-store.test.ts test/events.test.ts)

  android-checks:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: gradle/actions/setup-gradle@v4 is unusable on this self-hosted
      # runner. That repository is ~350MB, and act_runner performs a FULL clone
      # for every `uses` reference; on this host the transfer is cut off after
      # 6-8 minutes with `fatal: early EOF` (reproduced by cloning the same
      # repo inside the runner container), which leaves the action cache with
      # an unfinished pack and surfaces as `Unable to resolve v4: unsupported
      # object type`, failing the whole android-checks job. The Gradle
      # distribution itself is fetched by the wrapper, so only the Android SDK
      # has to be provided here. Gradle dependency caching is deliberately not
      # wired up: actions/cache on a self-hosted runner would introduce a
      # second failure mode for no correctness gain.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 platform-tools"

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
