name: Bug Report
description: Create a report to help us improve AgentHub
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant information as possible.
  - type: input
    id: version
    attributes:
      label: AgentHub Version
      description: What version of AgentHub are you using? (e.g., 2.4.93)
      placeholder: "2.4.93"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running agenthub-runner on?
      options:
        - Windows 11 / 10
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora)
        - macOS
        - Android (Companion PWA)
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Official Agent Runtime
      description: Which agent provider are you controlling?
      options:
        - Claude Code CLI
        - OpenAI Codex CLI
        - Both / Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
      placeholder: Steps to reproduce, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Runner / Gateway Logs
      description: Relevant logs or terminal output (please sanitize personal tokens or secrets).
      render: shell
