<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="hubBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <radialGradient id="centerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>

  <!-- Crisp White Squircle Background -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="url(#hubBg)" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- Subtle Central Ambient Glow -->
  <circle cx="256" cy="256" r="80" fill="#0ea5e9" opacity="0.18" />
  <circle cx="256" cy="256" r="45" fill="#38bdf8" opacity="0.25" />

  <!-- Radial spokes from center to vertices (Enlarged Cube R=162) -->
  <g stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="256" x2="256" y2="94" />
    <line x1="256" y1="256" x2="396" y2="175" />
    <line x1="256" y1="256" x2="396" y2="337" />
    <line x1="256" y1="256" x2="256" y2="418" />
    <line x1="256" y1="256" x2="116" y2="337" />
    <line x1="256" y1="256" x2="116" y2="175" />

    <!-- Hexagon perimeter -->
    <polygon points="256,94 396,175 396,337 256,418 116,337 116,175" fill="none"/>
  </g>

  <!-- Outer Vertex Ring Nodes -->
  <g stroke="#0284c7" stroke-width="7" fill="#ffffff">
    <circle cx="256" cy="94" r="18"/>
    <circle cx="396" cy="175" r="18"/>
    <circle cx="396" cy="337" r="18"/>
    <circle cx="256" cy="418" r="18"/>
    <circle cx="116" cy="337" r="18"/>
    <circle cx="116" cy="175" r="18"/>
  </g>

  <!-- Node Inner Accents -->
  <g fill="#0ea5e9">
    <circle cx="256" cy="94" r="4"/>
    <circle cx="396" cy="175" r="4"/>
    <circle cx="396" cy="337" r="4"/>
    <circle cx="256" cy="418" r="4"/>
    <circle cx="116" cy="337" r="4"/>
    <circle cx="116" cy="175" r="4"/>
  </g>

  <!-- Glowing Central Core Orb -->
  <circle cx="256" cy="256" r="34" fill="#0ea5e9" opacity="0.45" />
  <circle cx="256" cy="256" r="22" fill="url(#centerOrb)" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />
</svg>
