<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="hubBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#080b11"/>
    </radialGradient>
    <radialGradient id="centerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#70f3ff"/>
      <stop offset="75%" stop-color="#00d8f6"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </radialGradient>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#hubBg)"/>

  <!-- Radial spokes from center to vertices -->
  <g stroke="#00e5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="256" x2="256" y2="136" />
    <line x1="256" y1="256" x2="360" y2="196" />
    <line x1="256" y1="256" x2="360" y2="316" />
    <line x1="256" y1="256" x2="256" y2="376" />
    <line x1="256" y1="256" x2="152" y2="316" />
    <line x1="256" y1="256" x2="152" y2="196" />

    <!-- Hexagon perimeter -->
    <polygon points="256,136 360,196 360,316 256,376 152,316 152,196" fill="none"/>
  </g>

  <!-- Outer Vertex Ring Nodes -->
  <g stroke="#00e5ff" stroke-width="7" fill="#0b0f19">
    <circle cx="256" cy="136" r="15"/>
    <circle cx="360" cy="196" r="15"/>
    <circle cx="360" cy="316" r="15"/>
    <circle cx="256" cy="376" r="15"/>
    <circle cx="152" cy="316" r="15"/>
    <circle cx="152" cy="196" r="15"/>
  </g>

  <!-- Glowing Central Core Orb -->
  <circle cx="256" cy="256" r="46" fill="#00e5ff" opacity="0.32" />
  <circle cx="256" cy="256" r="28" fill="#00f5ff" opacity="0.65" />
  <circle cx="256" cy="256" r="19" fill="url(#centerOrb)" />
</svg>
