[workspace]
members = ["crates/runner", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "2.4.19"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.5.2"
dunce = "1.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
hmac = "0.12"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.14.8"
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls", "win-system-proxy"] }
url = "2.5.8"
uuid = { version = "1.18", features = ["v4", "serde"] }
