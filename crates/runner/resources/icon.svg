<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="hubBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <radialGradient id="centerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>

  <!-- Crisp White Squircle Background (Tight margin for maximum content scale) -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="url(#hubBg)" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- Subtle Central Ambient Glow -->
  <circle cx="256" cy="256" r="120" fill="#0ea5e9" opacity="0.20" />
  <circle cx="256" cy="256" r="65" fill="#38bdf8" opacity="0.28" />

  <!-- Radial spokes & Hexagon perimeter (Maximized Cube R=205, center (256, 256)) -->
  <g stroke="#0284c7" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="256" x2="256" y2="51" />
    <line x1="256" y1="256" x2="434" y2="153" />
    <line x1="256" y1="256" x2="434" y2="359" />
    <line x1="256" y1="256" x2="256" y2="461" />
    <line x1="256" y1="256" x2="78" y2="359" />
    <line x1="256" y1="256" x2="78" y2="153" />

    <!-- Hexagon perimeter -->
    <polygon points="256,51 434,153 434,359 256,461 78,359 78,153" fill="none"/>
  </g>

  <!-- Outer Vertex Ring Nodes (Larger & thicker for high-DPI and 16x16 tray visibility) -->
  <g stroke="#0284c7" stroke-width="10" fill="#ffffff">
    <circle cx="256" cy="51" r="25"/>
    <circle cx="434" cy="153" r="25"/>
    <circle cx="434" cy="359" r="25"/>
    <circle cx="256" cy="461" r="25"/>
    <circle cx="78" cy="359" r="25"/>
    <circle cx="78" cy="153" r="25"/>
  </g>

  <!-- Node Inner Accents -->
  <g fill="#0ea5e9">
    <circle cx="256" cy="51" r="7"/>
    <circle cx="434" cy="153" r="7"/>
    <circle cx="434" cy="359" r="7"/>
    <circle cx="256" cy="461" r="7"/>
    <circle cx="78" cy="359" r="7"/>
    <circle cx="78" cy="153" r="7"/>
  </g>

  <!-- Glowing Central Core Orb (Enlarged Core) -->
  <circle cx="256" cy="256" r="48" fill="#0ea5e9" opacity="0.45" />
  <circle cx="256" cy="256" r="32" fill="url(#centerOrb)" />
  <circle cx="256" cy="256" r="11" fill="#ffffff" />
</svg>
