<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hubBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="hubCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Squircle container with deep azure gradient -->
  <rect width="476" height="476" x="18" y="18" rx="108" fill="url(#hubBgGrad)"/>
  <rect width="474" height="474" x="19" y="19" rx="107" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Subtle ambient inner glow behind center -->
  <circle cx="256" cy="256" r="144" fill="#38bdf8" opacity="0.22"/>

  <!-- Radial spokes & Hexagon perimeter (bold & crisp) -->
  <g stroke="#f0f9ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <line x1="256" y1="256" x2="256" y2="68" />
    <line x1="256" y1="256" x2="418" y2="162" />
    <line x1="256" y1="256" x2="418" y2="350" />
    <line x1="256" y1="256" x2="256" y2="444" />
    <line x1="256" y1="256" x2="94" y2="350" />
    <line x1="256" y1="256" x2="94" y2="162" />

    <!-- Hexagon perimeter -->
    <polygon points="256,68 418,162 418,350 256,444 94,350 94,162" fill="none"/>
  </g>

  <!-- Outer Vertex Ring Nodes -->
  <g stroke="#bae6fd" stroke-width="10" fill="#0284c7">
    <circle cx="256" cy="68" r="28"/>
    <circle cx="418" cy="162" r="28"/>
    <circle cx="418" cy="350" r="28"/>
    <circle cx="256" cy="444" r="28"/>
    <circle cx="94" cy="350" r="28"/>
    <circle cx="94" cy="162" r="28"/>
  </g>

  <!-- Outer Vertex Core White Accents -->
  <g fill="#ffffff">
    <circle cx="256" cy="68" r="10"/>
    <circle cx="418" cy="162" r="10"/>
    <circle cx="418" cy="350" r="10"/>
    <circle cx="256" cy="444" r="10"/>
    <circle cx="94" cy="350" r="10"/>
    <circle cx="94" cy="162" r="10"/>
  </g>

  <!-- Glowing Central Core Orb -->
  <circle cx="256" cy="256" r="60" fill="#0284c7" opacity="0.55" />
  <circle cx="256" cy="256" r="42" fill="url(#hubCoreGlow)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
</svg>