<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top Face (lighter highlight) -->
    <linearGradient id="hubFacetTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.48"/>
    </linearGradient>
    <!-- Left Face -->
    <linearGradient id="hubFacetLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.40"/>
    </linearGradient>
    <!-- Right Face -->
    <linearGradient id="hubFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Electric Cyan-Azure Gradient for Spokes & Perimeter -->
    <linearGradient id="hubSpokes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Central Glowing Core Orb -->
    <radialGradient id="hubCoreOrb" cx="36%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Subtle drop shadow for crisp boundary contrast on any wallpaper -->
    <filter id="hubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#hubShadow)">
    <!-- Holographic 3D Facets (Top, Left, Right) -->
    <polygon points="256,256 256,32 450,144" fill="url(#hubFacetTop)"/>
    <polygon points="256,256 256,32 62,144" fill="url(#hubFacetTop)"/>
    <polygon points="256,256 62,144 62,368 256,480" fill="url(#hubFacetLeft)"/>
    <polygon points="256,256 450,144 450,368 256,480" fill="url(#hubFacetRight)"/>

    <!-- Subtle dark casing under strokes for contrast on bright/light screens -->
    <g stroke="#0369a1" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
      <line x1="256" y1="256" x2="256" y2="32" />
      <line x1="256" y1="256" x2="450" y2="144" />
      <line x1="256" y1="256" x2="450" y2="368" />
      <line x1="256" y1="256" x2="256" y2="480" />
      <line x1="256" y1="256" x2="62" y2="368" />
      <line x1="256" y1="256" x2="62" y2="144" />
      <polygon points="256,32 450,144 450,368 256,480 62,368 62,144" fill="none"/>
    </g>

    <!-- Glowing Electric Spokes & Hexagon Perimeter -->
    <g stroke="url(#hubSpokes)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <line x1="256" y1="256" x2="256" y2="32" />
      <line x1="256" y1="256" x2="450" y2="144" />
      <line x1="256" y1="256" x2="450" y2="368" />
      <line x1="256" y1="256" x2="256" y2="480" />
      <line x1="256" y1="256" x2="62" y2="368" />
      <line x1="256" y1="256" x2="62" y2="144" />
      <polygon points="256,32 450,144 450,368 256,480 62,368 62,144" fill="none"/>
    </g>

    <!-- 6 Outer Vertex Nodes (White body + Azure Rim + Cyan Center) -->
    <g stroke="#0284c7" stroke-width="12" fill="#ffffff">
      <circle cx="256" cy="32" r="30"/>
      <circle cx="450" cy="144" r="30"/>
      <circle cx="450" cy="368" r="30"/>
      <circle cx="256" cy="480" r="30"/>
      <circle cx="62" cy="368" r="30"/>
      <circle cx="62" cy="144" r="30"/>
    </g>
    <g fill="#0284c7">
      <circle cx="256" cy="32" r="12"/>
      <circle cx="450" cy="144" r="12"/>
      <circle cx="450" cy="368" r="12"/>
      <circle cx="256" cy="480" r="12"/>
      <circle cx="62" cy="368" r="12"/>
      <circle cx="62" cy="144" r="12"/>
    </g>

    <!-- Central Glowing Core Orb with Specular Highlight -->
    <circle cx="256" cy="256" r="56" fill="url(#hubCoreOrb)" stroke="#0369a1" stroke-width="8" />
    <circle cx="246" cy="246" r="16" fill="#ffffff" />
  </g>
</svg>